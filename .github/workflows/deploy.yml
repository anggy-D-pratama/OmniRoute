name: Deploy OmniRoute to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auth to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/omniroute/api:${{ github.sha }} .
          docker push asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/omniroute/api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy omniroute \
            --image "asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/omniroute/api:${{ github.sha }}" \
            --region asia-southeast1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --port 20128 \
            --set-env-vars="OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }},API_KEY=${{ secrets.OMNIROUTE_AUTH_KEY }},REDIS_URL=${{ secrets.REDIS_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},API_KEY_SECRET=${{ secrets.API_KEY_SECRET }},INITIAL_PASSWORD=${{ secrets.INITIAL_PASSWORD }}" \
            --execution-environment gen2 \
            --add-volume=name=omniroutedata,type=cloud-storage,bucket=omniroute-storage \
            --add-volume-mount=volume=omniroutedata,mount-path=/app/data
